<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Audit Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        .password-container { position: relative; }
        .password-toggle { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; }
        .form-card { background: linear-gradient(135deg, #f7f9fc 0%, #e0e7ff 100%); }
        .section-card { transition: transform 0.2s; }
        .section-card:hover { transform: scale(1.02); }
        .mandatory-star { color: red; }

        #signature-canvas { width: 90vw; max-width: 500px; height: 35vh; max-height: 300px; border: 2px solid #ccc; border-radius: 10px; background-color: white; touch-action: none; }
        @media (max-width: 600px) { #signature-canvas { height: 40vh; } }

        #photo-section { flex-direction: column; align-items: center; }
        #photo-section:not(.hidden) { display: flex; }
        #photo-section.hidden { display: none !important; }

        #video, #photo-canvas { width: 90vw; max-width: 400px; height: auto; border-radius: 12px; border: 1px solid #ccc; background-color: #000; object-fit: cover; }
        #photo-section button { width: 120px; }

        /* ── Upload Wizard ── */
        .upload-step { display: none; }
        .upload-step.active { display: block; }

        .sheet-checkbox-label {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; border: 2px solid #e5e7eb;
            border-radius: 10px; cursor: pointer;
            transition: border-color .2s, background .2s;
            font-weight: 500; color: #374151;
        }
        .sheet-checkbox-label:hover { border-color: #6366f1; background: #f5f3ff; }
        .sheet-checkbox-label input:checked + span { color: #4f46e5; }
        .sheet-checkbox-label:has(input:checked) {
            border-color: #6366f1; background: #eef2ff;
        }

        .col-map-card {
            background: #fff; border: 1px solid #e5e7eb;
            border-radius: 12px; padding: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,.06);
        }
        .col-map-card h4 {
            font-weight: 700; color: #1e1b4b;
            margin-bottom: 12px; font-size: .95rem;
            display: flex; align-items: center; gap: 8px;
        }

        .progress-bar-track {
            width: 100%; height: 4px;
            background: #e5e7eb; border-radius: 2px; margin-bottom: 20px;
        }
        .progress-bar-fill {
            height: 100%; border-radius: 2px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            transition: width .3s ease;
        }

        .step-indicator {
            display: flex; gap: 6px; margin-bottom: 18px;
            font-size: .75rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: .05em; color: #9ca3af;
        }
        .step-indicator .step { padding: 4px 10px; border-radius: 99px; background: #f3f4f6; }
        .step-indicator .step.done { background: #c7d2fe; color: #4338ca; }
        .step-indicator .step.active { background: #6366f1; color: #fff; }

        .preview-tag {
            display: inline-flex; align-items: center; gap: 6px;
            background: #eef2ff; color: #4338ca;
            border-radius: 99px; padding: 3px 10px;
            font-size: .78rem; font-weight: 600; margin: 3px;
        }

        #upload-progress-wrap { display: none; }
        #upload-progress-wrap.show { display: block; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <!-- ── Sticky Header ── -->
    <div id="sticky-header" class="sticky top-0 z-40 bg-white border-b border-gray-200 shadow-sm">
        <div class="mx-auto px-4 sm:px-6 max-w-2xl py-3 flex items-center justify-between relative">
            <button id="menu-icon-header" class="text-2xl text-gray-700 hover:text-gray-900 focus:outline-none mr-2">
                <i class="fas fa-bars"></i>
            </button>
            <h1 class="text-xl sm:text-2xl font-semibold text-gray-900 text-center flex-1">
                Daily Audit Dashboard
            </h1>
            <div class="flex items-center gap-2">
                <button id="switch-admin-btn" title="Switch to Admin Panel" class="hidden flex items-center justify-center w-8 h-8 bg-indigo-100 text-indigo-700 rounded-full hover:bg-indigo-200 border border-indigo-300 transition shadow-sm">
                    <i class="fas fa-hammer"></i>
                </button>
                <button id="logout" class="text-indigo-600 hover:text-indigo-800"><i class="fas fa-sign-out-alt text-xl"></i></button>
            </div>
        </div>
        <div id="user-info" class="text-gray-500 text-xs text-center pb-1 px-4"></div>
    </div>

    <div class="container mx-auto p-4 sm:p-6 max-w-2xl" id="checklist-container">

        <!-- Tabs: Assigned Tasks / Checklist / History -->
        <div class="flex gap-4 border-b mb-4" id="checklist-tabs-bar">
            <button id="checklist-tab-tasks" class="px-4 py-2 font-semibold text-indigo-600 border-b-2 border-indigo-600 text-sm">Assigned Tasks</button>
            <button id="checklist-tab-current" class="px-4 py-2 font-semibold text-gray-500 border-b-2 border-transparent text-sm">Checklist</button>
            <button id="checklist-tab-history" class="px-4 py-2 font-semibold text-gray-500 border-b-2 border-transparent text-sm">History</button>
        </div>

        <!-- Assigned Tasks Tab -->
        <div id="assigned-tasks-content">
            <div id="assigned-tasks-panel" class="bg-white border border-indigo-100 rounded-lg shadow-sm p-4 mb-4">
                <div class="flex items-center justify-between gap-3 mb-3">
                    <div>
                        <h2 class="text-base font-semibold text-gray-800 flex items-center gap-2">
                            <i class="fas fa-tasks text-indigo-600"></i>
                            Assigned Tasks
                            <span id="assigned-tasks-count" class="hidden text-xs font-semibold bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full"></span>
                        </h2>
                    </div>
                    <button id="assigned-tasks-refresh" type="button" title="Refresh assigned tasks" class="w-8 h-8 rounded-full border border-gray-200 text-gray-500 hover:text-indigo-700 hover:bg-indigo-50">
                        <i class="fas fa-sync-alt text-sm"></i>
                    </button>
                </div>
                <div id="assigned-tasks-list" class="space-y-2"></div>
            </div>
        </div>

        <!-- Current Checklist Tab -->
        <div id="checklist-current-content" class="hidden">
            <div id="section-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>

            <div class="mt-4 space-y-2">
                <button id="submit-audit" class="w-full bg-green-600 text-white p-2.5 rounded-lg hover:bg-green-700">Submit Audit</button>
                <button id="export-excel" class="w-full bg-blue-600 text-white p-2.5 rounded-lg hover:bg-blue-700">Export to Excel</button>
            </div>
        </div>

        <!-- History Tab -->
        <div id="checklist-history-content" class="hidden">
            <div id="checklist-history-list" class="space-y-3">
                <p class="text-gray-400 text-center py-8">Loading…</p>
            </div>
        </div>
    </div>

    <!-- Sidebar Navigation -->
    <div id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-white shadow-xl transform -translate-x-full transition-transform duration-300 z-50">
        <div class="p-4 border-b flex justify-between items-center">
            <h2 class="text-lg font-semibold text-gray-800">Menu</h2>
            <button id="close-sidebar" class="text-gray-500 hover:text-gray-800">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <ul class="mt-4 space-y-2">
            <li>
                <button id="nav-checklist" class="w-full text-left px-6 py-2 hover:bg-gray-100 rounded-lg transition">
                    <i class="fas fa-clipboard-list mr-2 text-indigo-600"></i> Checklist
                </button>
            </li>
            <li id="nav-stock-count-item">
                <button id="nav-stock-count" class="w-full text-left px-6 py-2 hover:bg-gray-100 rounded-lg transition">
                    <i class="fas fa-box mr-2 text-blue-600"></i> Stock Count
                </button>
            </li>

            <li>
                <button id="nav-send-email" class="w-full text-left px-6 py-2 hover:bg-gray-100 rounded-lg transition">
                    <i class="fas fa-envelope mr-2 text-green-600"></i> Send Email
                </button>
            </li>
        </ul>
    </div>

    <!-- Hidden legacy menu-icon kept for JS compatibility -->
    <button id="menu-icon" class="hidden"></button>

    <!-- Send Email Section -->
    <div id="send-email-section" class="hidden container mx-auto p-6 max-w-xl">
        <h2 class="text-2xl font-semibold text-gray-800 mb-4">Send Email to Auditor Manager</h2>
        <form id="send-email-form" class="bg-white p-6 rounded-xl shadow-md">
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Upload Documents (PDF/Excel)</label>
                <input type="file" id="email-file" accept=".pdf,.xlsx,.xls,.xlsb" multiple class="w-full p-2 border border-gray-300 rounded-lg">
                <p class="text-xs text-gray-500 mt-1">You can select multiple files (Ctrl/Cmd+Click)</p>
                
                <!-- Selected files list -->
                <div id="selected-files-list" class="hidden mt-3 space-y-2"></div>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">To <span class="mandatory-star">*</span></label>
                <input type="email" id="email-to" placeholder="Enter auditor manager email" class="w-full p-2 border border-gray-300 rounded-lg" required>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Subject</label>
                <input type="text" id="email-subject" placeholder="Email subject (optional)" class="w-full p-2 border border-gray-300 rounded-lg">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Message</label>
                <textarea id="email-body" rows="5" placeholder="Type your message here..." class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"></textarea>
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700">Send Email</button>
        </form>
    </div>

    <!-- Stock Count Section -->
    <div id="stock-count-section" class="hidden container mx-auto p-6 max-w-4xl">
        <h2 class="text-2xl font-semibold text-gray-800 mb-4">Stock Count</h2>
        
        <!-- Tabs: Pending / Completed / History -->
        <div class="flex gap-4 border-b mb-4">
            <button id="sc-tab-pending" class="px-4 py-2 font-semibold text-indigo-600 border-b-2 border-indigo-600 text-sm">Pending</button>
            <button id="sc-tab-completed" class="px-4 py-2 font-semibold text-gray-500 border-b-2 border-transparent text-sm">Completed</button>
            <button id="sc-tab-history" class="px-4 py-2 font-semibold text-gray-500 border-b-2 border-transparent text-sm">History</button>
        </div>

        <!-- Pending Tab (current stock count form) -->
        <div id="sc-pending-content">
            <div class="mb-4">
                <input type="text" id="stock-search" placeholder="Search by Item Code or Item Name..."
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>
            <div id="stock-sheet-tabs" class="hidden mb-4 flex gap-2 flex-wrap"></div>
            <div id="stock-items-list" class="space-y-2 mb-4"></div>
            <div id="stock-items-pagination" class="mb-4"></div>
            <div class="flex gap-4">
                <button id="submit-stock-count" class="flex-1 bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 font-semibold">
                    Submit Stock Count
                </button>
                <button id="export-stock-count-excel" class="flex-1 bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 font-semibold">
                    Export to Excel
                </button>
            </div>
        </div>

        <!-- Completed Tab -->
        <div id="sc-completed-content" class="hidden">
            <div id="sc-completed-list" class="space-y-3">
                <p class="text-gray-400 text-center py-8">Loading…</p>
            </div>
        </div>

        <!-- History Tab -->
        <div id="sc-history-content" class="hidden">
            <div id="sc-history-list" class="space-y-3">
                <p class="text-gray-400 text-center py-8">Loading…</p>
            </div>
        </div>
    </div>



    <div id="section-content" class="container mx-auto p-4 sm:p-6 max-w-xl hidden">
        <button id="back-to-dashboard" class="mb-4 bg-gray-200 text-gray-800 p-2 rounded-lg hover:bg-gray-300">Back to Dashboard</button>
        <form id="section-form" class="form-card p-6 rounded-xl shadow-lg"></form>

        <!-- Signature Section -->
        <div id="signature-section" class="hidden mt-6 text-center">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Signature Section</h2>
            <canvas id="signature-canvas" width="400" height="200" class="border border-gray-300 rounded-lg shadow-md bg-white mx-auto"></canvas>
            <div class="mt-3 flex justify-center space-x-3">
                <button id="save-signature" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">Save</button>
                <button id="clear-signature" class="bg-gray-300 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-400">Clear</button>
            </div>
        </div>

        <!-- Photo Section -->
        <div id="photo-section" class="hidden mt-6 container mx-auto px-4 max-w-4xl">
            <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">Photo Gallery</h2>
            
            <!-- Photo Gallery Grid -->
            <div id="photo-gallery" class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6"></div>
            
            <!-- Camera/Upload Interface -->
            <div class="bg-gray-50 border-2 border-dashed border-gray-300 rounded-lg p-4 mb-4">
                <video id="video" width="400" height="250" autoplay class="rounded-lg border border-gray-300 shadow-md mx-auto mb-3 hidden"></video>
                <canvas id="photo-canvas" width="400" height="250" class="rounded-lg border border-gray-300 shadow-md mx-auto mb-3"></canvas>
                
                <div class="flex flex-wrap gap-2 justify-center">
                    <button id="take-photo" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 flex items-center gap-2">
                        <i class="fas fa-camera"></i>Take Photo
                    </button>
                    <button id="upload-photo-btn" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 flex items-center gap-2">
                        <i class="fas fa-upload"></i>Upload Photos
                    </button>
                    <input type="file" id="photo-file-input" accept="image/*" capture="environment" multiple class="hidden">
                    <button id="retake-photo" class="hidden bg-yellow-600 text-white px-4 py-2 rounded-lg hover:bg-yellow-700 flex items-center gap-2">
                        <i class="fas fa-redo"></i>Retake
                    </button>
                    <button id="add-geo-label" class="hidden bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 flex items-center gap-2">
                        <i class="fas fa-map-marker-alt"></i>Add Location
                    </button>
                    <button id="add-to-gallery-btn" class="hidden bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 flex items-center gap-2">
                        <i class="fas fa-plus"></i>Add to Gallery
                    </button>
                    <button id="add-location-to-all-btn" class="hidden bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 flex items-center gap-2">
                        <i class="fas fa-map-marked-alt"></i>Add Location to All
                    </button>
                </div>
            </div>
            
            <button id="save-photo" class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 font-semibold flex items-center justify-center gap-2">
                <i class="fas fa-save"></i>Save All Photos
            </button>
        </div>
    </div>

    <!-- Confirm Submit Modal -->
    <div id="confirm-submit-modal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex justify-center items-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-lg w-80 text-center">
            <h2 class="text-xl font-semibold mb-4">Confirm Submission</h2>
            <p class="text-gray-600 mb-6" id="confirm-submit-msg">Do you want to submit?</p>
            <div class="flex justify-center gap-4">
                <button id="btn-submit-yes" class="bg-indigo-600 text-white px-4 py-2 rounded shadow hover:bg-indigo-700">Yes</button>
                <button id="btn-submit-no" class="bg-gray-300 px-4 py-2 rounded shadow hover:bg-gray-400 text-gray-800">No</button>
            </div>
        </div>
    </div>

    <!-- Email Modal -->
    <div id="email-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-lg w-96 relative">
            <button id="btn-email-close" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
            <h2 class="text-xl font-semibold mb-4 text-center">Send Email to Manager</h2>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Manager Email</label>
                <input type="email" id="modal-email-to" class="w-full border border-gray-300 rounded p-2 focus:ring focus:ring-indigo-200" placeholder="manager@example.com">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
                <input type="text" id="modal-email-subject" class="w-full border border-gray-300 rounded p-2 focus:ring focus:ring-indigo-200" placeholder="Email subject (optional)">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Description / Body</label>
                <textarea id="modal-email-body" class="w-full border border-gray-300 rounded p-2 focus:ring focus:ring-indigo-200" rows="3" placeholder="Enter message..."></textarea>
            </div>
            <button id="btn-send-modal-email" class="w-full bg-green-600 text-white rounded py-2 hover:bg-green-700 font-semibold shadow">Send Email with Attached Data</button>
        </div>
    </div>

    <!-- Stock Count Email Modal -->
    <div id="stock-count-email-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-lg w-96 relative">
            <button id="btn-sc-email-close" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
            <h2 class="text-xl font-semibold mb-4 text-center">Send Stock Count via Email</h2>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Manager Email</label>
                <input type="email" id="sc-email-to" class="w-full border border-gray-300 rounded p-2 focus:ring focus:ring-indigo-200" placeholder="manager@example.com">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
                <input type="text" id="sc-email-subject" class="w-full border border-gray-300 rounded p-2 focus:ring focus:ring-indigo-200" placeholder="Email subject (optional)">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Description / Body</label>
                <textarea id="sc-email-body" class="w-full border border-gray-300 rounded p-2 focus:ring focus:ring-indigo-200" rows="3" placeholder="Enter message..."></textarea>
            </div>
            <div class="flex gap-2">
                <button id="btn-send-sc-email" class="flex-1 bg-green-600 text-white rounded py-2 hover:bg-green-700 font-semibold shadow">Send</button>
                <button onclick="closeStockCountEmailModal()" class="flex-1 bg-gray-300 text-gray-700 rounded py-2 hover:bg-gray-400 font-semibold">Cancel</button>
            </div>
        </div>
    </div>

    <!-- SheetJS for client-side Excel parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="/static/js/script.js?v=assigned-tasks-2"></script>
</body>
</html>
